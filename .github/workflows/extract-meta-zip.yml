name: Extract MyM Meta AI Zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Meta AI ZIP
        run: |
          echo "Extracting mym-app-FINAL-DEPLOY.zip..."

          unzip -o "mym-app-FINAL-DEPLOY.zip" -d extracted

          echo "Checking extracted files..."
          find extracted -maxdepth 3 -type f | head -100

          echo "Moving project files into repository root..."

          shopt -s dotglob nullglob

          items=(extracted/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -R "${items[0]}"/* .
          else
            cp -R extracted/* .
          fi

          echo "Removing temporary files..."
          rm -rf extracted
          rm -f "mym-app-FINAL-DEPLOY.zip"

      - name: Commit Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract MyM frontend from Meta AI ZIP"
          git push
